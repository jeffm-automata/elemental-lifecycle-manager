{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
    helm.sh/resource-policy: keep
  name: releasesources.lifecycle.suse.com
spec:
  group: lifecycle.suse.com
  names:
    categories:
    - elemental
    kind: ReleaseSource
    listKind: ReleaseSourceList
    plural: releasesources
    shortNames:
    - relsrc
    singular: releasesource
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.registry
      name: Registry
      type: string
    - jsonPath: .status.releases
      name: Releases
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.stale
      name: Stale
      type: boolean
    - jsonPath: .status.lastSuccessfulSyncTime
      name: Last-Success
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ReleaseSource is one OCI repository of release manifests that
          the release catalog queries.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ReleaseSourceSpec names one OCI repository that holds release
              manifests, one tag per release.
            properties:
              caBundle:
                description: CABundle is a PEM bundle of additional certificate authorities
                  trusted for this registry.
                format: byte
                type: string
              insecure:
                description: Insecure allows plain HTTP and skips the verification
                  of the registry's TLS certificate.
                type: boolean
              interval:
                description: Interval is the time between two queries of the repository.
                  Defaults to 5m; the minimum is 30s.
                type: string
              pullSecretRef:
                description: |-
                  PullSecretRef names a Secret of type kubernetes.io/dockerconfigjson in the namespace of the
                  catalog controller, used to authenticate against the registry. Anonymous access when empty.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              registry:
                description: |-
                  Registry is the OCI repository of the release manifests, without a tag and without a scheme,
                  e.g. "registry.suse.com/beta/uc/rke2/rke2-manifest". It has the same form and meaning as
                  spec.registry of a Release.
                minLength: 1
                type: string
            required:
            - registry
            type: object
          status:
            description: ReleaseSourceStatus is the observed state of a ReleaseSource.
            properties:
              conditions:
                description: Conditions of the source. Type "Ready".
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSuccessfulSyncTime:
                description: LastSuccessfulSyncTime is the time of the last query
                  that read the tag list.
                format: date-time
                type: string
              lastSyncTime:
                description: LastSyncTime is the time of the last query, successful
                  or not.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the status was computed
                  for.
                format: int64
                type: integer
              releases:
                description: Releases is the number of AvailableRelease objects published
                  for this source.
                format: int32
                type: integer
              skipped:
                description: Skipped lists tags that are not published, with the reason
                  (at most 50 entries).
                items:
                  description: SkippedTag is a tag of the repository that is not published
                    as an AvailableRelease.
                  properties:
                    reason:
                      description: Reason the tag is not published.
                      type: string
                    tag:
                      description: Tag as listed by the registry.
                      type: string
                  required:
                  - reason
                  - tag
                  type: object
                type: array
              stale:
                description: |-
                  Stale is true when the last query could not read the tag list: the published
                  releases are the last known ones.
                type: boolean
            required:
            - releases
            - stale
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
