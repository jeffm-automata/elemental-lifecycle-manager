replicaCount: 1

image:
  repository: registry.suse.com/elemental/elemental-release-catalog
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The two custom resource definitions are in crds/: Helm installs them before everything else on the
# first install, never changes them afterwards and keeps them on uninstall. To update them:
#   kubectl apply --server-side -f charts/elemental-release-catalog/crds/
# Deleting them deletes every ReleaseSource and AvailableRelease.

# ClusterRole "<fullname>-reader": get, list, watch on the catalog objects. Bind it to the users
# who may see the catalog; set authenticated to true to bind it to every authenticated user.
reader:
  create: true
  authenticated: false

# ReleaseSource objects to create with the chart, by name. Example:
#   sources:
#     core:
#       registry: registry.suse.com/beta/uc/rke2/rke2-manifest
#       interval: 5m
sources: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

extraArgs: []
extraEnv: []
