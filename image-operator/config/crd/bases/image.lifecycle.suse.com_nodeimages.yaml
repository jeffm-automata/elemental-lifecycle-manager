---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: nodeimages.image.lifecycle.suse.com
spec:
  group: image.lifecycle.suse.com
  names:
    kind: NodeImage
    listKind: NodeImageList
    plural: nodeimages
    singular: nodeimage
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.cacheHit
      name: CacheHit
      type: boolean
    - jsonPath: .status.image.name
      name: Image
      type: string
    - jsonPath: .status.image.kubernetesVersion
      name: Kubernetes
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NodeImage asks for the node image of a release to exist on a
          target.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NodeImageSpec asks for the node image of one release on one target. It can not be changed:
              a different release, target or configuration is a different NodeImage.
            properties:
              arch:
                default: x86_64
                description: Arch is the machine architecture of the image. Only x86_64
                  has been run.
                enum:
                - x86_64
                - aarch64
                type: string
              builder:
                description: |-
                  Builder says where the build runs when the image is not on the target yet. Empty: the
                  operator's default (its --builder flag). It does not change the image and is not part of
                  the cache key.
                enum:
                - vm
                - pod
                type: string
              config:
                default: {}
                description: |-
                  ConfigSpec is everything a requester may change about the content of the image. All of it is part
                  of the cache key.
                properties:
                  chartValues:
                    description: ChartValues gives Helm values for charts of the release.
                    items:
                      description: ChartValues are Helm values for one chart of the
                        release.
                      properties:
                        chart:
                          description: Chart is the chart name as the release manifest
                            lists it.
                          pattern: ^[a-z0-9]([-a-z0-9.]{0,61}[a-z0-9])?$
                          type: string
                        values:
                          description: Values is a YAML document of Helm values.
                          maxLength: 16384
                          type: string
                      required:
                      - chart
                      - values
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - chart
                    x-kubernetes-list-type: map
                  diskSize:
                    default: 20G
                    description: DiskSize is the virtual size of the image; node disks
                      must be at least this big.
                    pattern: ^[1-9][0-9]{0,4}[MG]$
                    type: string
                type: object
              deletionPolicy:
                default: Retain
                description: DeletionPolicy says what happens to the image on the
                  target when the last request for it is deleted.
                enum:
                - Retain
                - Delete
                type: string
              release:
                description: ReleaseSpec names the release the image is built from.
                properties:
                  manifest:
                    description: Manifest is the OCI reference of a release manifest,
                      by tag or by digest, without a scheme.
                    maxLength: 512
                    minLength: 1
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._:/@-]*$
                    type: string
                required:
                - manifest
                type: object
              target:
                description: TargetSpec says what the image is for and where it is
                  delivered.
                properties:
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef names a Secret in the namespace of the NodeImage whose key "kubeconfig"
                      gives access to the target.
                    properties:
                      name:
                        pattern: ^[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?$
                        type: string
                    required:
                    - name
                    type: object
                  harvester:
                    description: Harvester holds the settings of target type "harvester".
                    properties:
                      namePrefix:
                        default: elemental-
                        description: NamePrefix is put in front of every object the
                          operator creates on the target.
                        pattern: ^[a-z]([-a-z0-9]{0,30}-)?$
                        type: string
                      namespace:
                        description: Namespace of the image, and of the short-lived
                          builder VM.
                        pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
                        type: string
                      storageClassName:
                        default: harvester-longhorn
                        description: StorageClassName is the storage class volumes
                          created from the image use.
                        pattern: ^[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?$
                        type: string
                    required:
                    - namespace
                    type: object
                  type:
                    description: Type of the target. Only "harvester" is implemented.
                    maxLength: 32
                    minLength: 1
                    pattern: ^[a-z0-9-]+$
                    type: string
                required:
                - credentialsSecretRef
                - type
                type: object
                x-kubernetes-validations:
                - message: target type harvester needs the harvester section
                  rule: self.type != 'harvester' || has(self.harvester)
            required:
            - release
            - target
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; create a new NodeImage
              rule: self == oldSelf
          status:
            description: NodeImageStatus is what the operator observed.
            properties:
              build:
                description: BuildStatus is the history of builders this request had.
                  It is absent on a cache hit.
                properties:
                  attempts:
                    description: Attempts counts failed builds or deliveries.
                    format: int32
                    type: integer
                  backend:
                    description: 'Backend is where that builder ran: vm or pod.'
                    enum:
                    - vm
                    - pod
                    type: string
                  builder:
                    description: Builder is the name of the current or last builder.
                    type: string
                  finishedAt:
                    format: date-time
                    type: string
                  lastError:
                    description: LastError is the last failure, with the end of the
                      build log when there is one.
                    type: string
                  startedAt:
                    format: date-time
                    type: string
                type: object
              cacheHit:
                description: CacheHit is true when the image was found on the target
                  and this request never had a builder.
                type: boolean
              cacheKey:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              image:
                description: |-
                  ImageStatus describes the image on the target. For Harvester, Namespace/Name is what a machine
                  template refers to.
                properties:
                  displayName:
                    type: string
                  kubernetesVersion:
                    description: KubernetesVersion is the version in the image, as
                      a control plane object must state it.
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                  sha256:
                    type: string
                type: object
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: Phase is a one-word summary of the conditions.
                type: string
              readyAt:
                description: ReadyAt is when the image first became usable for this
                  request.
                format: date-time
                type: string
              release:
                description: ReleaseStatus is the release as resolved at the registry.
                properties:
                  manifestDigest:
                    type: string
                  resolvedAt:
                    format: date-time
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
